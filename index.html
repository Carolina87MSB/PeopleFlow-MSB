<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/msb-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal PeopleFlow — MSB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Presença por QR: se o link de login do e-mail cair na raiz (Redirect URL não
      // liberada no Supabase), volta para /participar/:token com a sessão da URL.
      try {
        var pend = JSON.parse(localStorage.getItem("pf_participar_pendente") || "null");
        if (pend && Date.now() - pend.ts < 3600000 && location.pathname === "/" && /access_token|code=/.test(location.hash + location.search)) {
          localStorage.removeItem("pf_participar_pendente");
          location.replace("/participar/" + encodeURIComponent(pend.token) + location.search + location.hash);
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
